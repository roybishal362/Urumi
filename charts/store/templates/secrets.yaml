{{- /*
Four Secrets instead of one, so each workload mounts only what it needs:
  -db            MariaDB and WordPress
  -wp-admin      the WP-CLI setup container
  -wc-api        the WP-CLI setup container (to register the key) and the MCP server
  -woo-mcp-auth  the MCP server, and the gateway that must present it
The MCP server therefore never holds a database or WordPress admin password.
*/ -}}
{{- $fullname := include "store.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-db" $fullname) "key" "mariadb-root-password" "value" .Values.secrets.mariadbRootPassword) | quote }}
  mariadb-password: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-db" $fullname) "key" "mariadb-password" "value" .Values.secrets.mariadbPassword) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-wp-admin
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.store.adminUser | b64enc | quote }}
  email: {{ .Values.store.adminEmail | b64enc | quote }}
  password: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-wp-admin" $fullname) "key" "password" "value" .Values.secrets.wpAdminPassword "length" 24) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-wc-api
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-wc-api" $fullname) "key" "consumer-key" "value" .Values.secrets.wcConsumerKey "prefix" "ck_" "length" 40) | quote }}
  consumer-secret: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-wc-api" $fullname) "key" "consumer-secret" "value" .Values.secrets.wcConsumerSecret "prefix" "cs_" "length" 40) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-woo-mcp-auth
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "store.secretValue" (dict "ctx" . "name" (printf "%s-woo-mcp-auth" $fullname) "key" "token" "value" .Values.secrets.mcpAuthToken "length" 48) | quote }}
