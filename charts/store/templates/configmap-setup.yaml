apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "store.fullname" . }}-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
data:
  setup.sh: |
    {{- .Files.Get "files/setup.sh" | nindent 4 }}
  ensure-api-key.php: |
    {{- .Files.Get "files/ensure-api-key.php" | nindent 4 }}
