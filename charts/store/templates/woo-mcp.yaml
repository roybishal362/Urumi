{{- $fullname := include "store.fullname" . -}}
# ClusterIP and no Ingress: the MCP server has no route from outside the
# cluster. The NetworkPolicy in networkpolicy.yaml narrows it further to the
# gateway's pods only.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels:
      {{- include "store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: woo-mcp
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: woo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: "8000"
            - name: STORE_NAME
              value: {{ .Values.store.title | quote }}
            # Where requests are sent: straight to the WordPress Service.
            - name: WC_INTERNAL_URL
              value: {{ include "store.internalUrl" . | quote }}
            # What the store calls itself. WooCommerce signs against this URL,
            # and product links returned to users point here.
            - name: STORE_PUBLIC_URL
              value: {{ include "store.publicUrl" . | quote }}
            - name: WC_REQUEST_TIMEOUT
              value: {{ .Values.wooMcp.requestTimeoutSeconds | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-wc-api
                  key: consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-wc-api
                  key: consumer-secret
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-woo-mcp-auth
                  key: token
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
