{{- /*
Secrets, split by who needs them:
  -app   the gateway backend (and Postgres, for its own password)
  -llm   the gateway backend: the model provider's API key
  -demo  the demo shipping server: the key callers must present
  -seed  the gateway backend: servers to register on first start, including
         the credentials the gateway will present to them
The dashboard pod mounts none of them.
*/ -}}
{{- $fullname := include "gateway.fullname" . -}}
{{- $shippingKey := include "gateway.secretValue" (dict "ctx" . "name" (printf "%s-demo" $fullname) "key" "shipping-api-key" "value" .Values.secrets.shippingApiKey "length" 40) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ include "gateway.secretValue" (dict "ctx" . "name" (printf "%s-app" $fullname) "key" "admin-password" "value" .Values.secrets.adminPassword "length" 20) | quote }}
  session-secret: {{ include "gateway.secretValue" (dict "ctx" . "name" (printf "%s-app" $fullname) "key" "session-secret" "value" .Values.secrets.sessionSecret) | quote }}
  encryption-key: {{ include "gateway.secretValue" (dict "ctx" . "name" (printf "%s-app" $fullname) "key" "encryption-key" "value" .Values.secrets.encryptionKey) | quote }}
  postgres-password: {{ include "gateway.secretValue" (dict "ctx" . "name" (printf "%s-app" $fullname) "key" "postgres-password" "value" .Values.secrets.postgresPassword "length" 32) | quote }}
{{- if not .Values.llm.existingSecret }}
{{- /* Keep a key that was set on an earlier install when this upgrade does not pass one. */ -}}
{{- $llmKey := "" -}}
{{- $llmExisting := lookup "v1" "Secret" .Release.Namespace (printf "%s-llm" $fullname) -}}
{{- if .Values.llm.apiKey -}}
{{- $llmKey = .Values.llm.apiKey | toString | b64enc -}}
{{- else if and $llmExisting $llmExisting.data (hasKey $llmExisting.data "api-key") -}}
{{- $llmKey = index $llmExisting.data "api-key" -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-llm
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $llmKey | quote }}
{{- end }}
{{- if .Values.demoServers.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-demo
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  shipping-api-key: {{ $shippingKey | quote }}
{{- end }}
{{- /* ---- seed servers ---- */ -}}
{{- $seeds := list -}}
{{- with .Values.seedServers.woo -}}
{{- if .enabled -}}
{{- $token := .token | toString -}}
{{- if not $token -}}
{{- /* Read the token from the store release. Works on a real install or upgrade;
       `helm template` has no cluster to ask, and renders it empty. */ -}}
{{- $source := lookup "v1" "Secret" .tokenSecret.namespace .tokenSecret.name -}}
{{- if and $source $source.data (hasKey $source.data .tokenSecret.key) -}}
{{- $token = index $source.data .tokenSecret.key | b64dec -}}
{{- end -}}
{{- end -}}
{{- $seeds = append $seeds (dict "slug" .slug "name" .name "url" .url "auth_type" "bearer" "credential" $token "requires_credential" true) -}}
{{- end -}}
{{- end -}}
{{- if .Values.demoServers.enabled -}}
{{- $seeds = append $seeds (dict "slug" "fx" "name" "Currency" "url" (printf "http://%s-fx.%s.svc.cluster.local:8000/mcp" $fullname .Release.Namespace) "auth_type" "none") -}}
{{- $seeds = append $seeds (dict "slug" "shipping" "name" "Shipping" "url" (printf "http://%s-shipping.%s.svc.cluster.local:8000/mcp" $fullname .Release.Namespace) "auth_type" "header" "auth_header" "X-API-Key" "credential" ($shippingKey | b64dec) "requires_credential" true) -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-seed
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  servers.json: {{ $seeds | toJson | quote }}
