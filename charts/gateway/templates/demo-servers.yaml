{{- if .Values.demoServers.enabled -}}
{{- $fullname := include "gateway.fullname" . -}}
{{- range $kind := list "fx" "shipping" }}
---
# ClusterIP and no Ingress route: reachable only inside the cluster, and the
# NetworkPolicy narrows that to the gateway's pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $kind }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ $kind }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "gateway.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ $kind }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $kind }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ $kind }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: mcp-{{ $kind }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" $ | nindent 8 }}
        app.kubernetes.io/component: mcp-{{ $kind }}
        # Shared by both demo servers, for the NetworkPolicy.
        urumi.dev/role: upstream-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "gateway.podSecurityContext" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: mcp
          image: "{{ $.Values.demoServers.image.repository }}:{{ $.Values.demoServers.image.tag }}"
          imagePullPolicy: {{ $.Values.demoServers.image.pullPolicy }}
          env:
            - name: SERVER_KIND
              value: {{ $kind }}
            {{- if eq $kind "shipping" }}
            # The shipping server demands a key in the X-API-Key header. The
            # gateway holds the same key (encrypted) and presents it on every
            # call; team members never see it.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-demo
                  key: shipping-api-key
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.demoServers.resources | nindent 12 }}
          securityContext:
            {{- include "gateway.containerSecurityContext" $ | nindent 12 }}
{{- end }}
{{- end }}
