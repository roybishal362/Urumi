# Serves the built dashboard. It proxies nothing: the Ingress routes /api and
# /mcp straight to the gateway, so this container needs no network access.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The page may only load its own scripts and call its own origin.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Invite links carry a one-time token in the URL; never send it on as a referrer.
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never answer discovery requests with the app's HTML; MCP clients probe here.
    location /.well-known/ {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Build output has content hashes in its file names, so it can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Any other path is a page of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
